user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    expires       15552000s;
    add_header Cache-Control "public, no-transform";
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    autoindex on;
    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;

    # vdev is rebuilt every night from the current main commit, so it must
    # never be cached: a cached copy is ABI-incompatible with the next
    # night's binaries and segfaults extension loads (e.g. the Node.js JSON
    # tests, exit 139). no-store keeps Cloudflare passing every vdev request
    # through to the origin. Release lines stay on the long-lived cache above.
    # This server is the default, so it also serves everything the stock
    # default.conf server used to serve (same root, autoindex from above).
    server {
        listen 80 default_server;
        root /usr/share/nginx/html;

        location /vdev/ {
            expires -1;
            add_header Cache-Control "no-store";
        }
    }

    include /etc/nginx/conf.d/*.conf;
}