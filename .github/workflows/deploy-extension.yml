name: Deploy Extensions

on: 
  workflow_call:

jobs:
  deploy-extensions:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Free disk space on Ubuntu runner
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      
      - uses: actions/checkout@v4

      - name: Restructure directories
        run: |
          mv scripts/extension ../extension-scripts
          rm -rf *
          mv ../extension-scripts/* .

      - uses: actions/download-artifact@v4
        with:
          name: lbug-extensions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # HACK(one-time 0.22.0 rerun): also tag 0.22.0 alongside latest so
          # future runs can pin to a versioned tag instead of the mutable
          # :latest. REVERT once we have a working extension build.
          tags: |
            ghcr.io/ladybugdb/extension-repo:latest
            ghcr.io/ladybugdb/extension-repo:0.22.0
