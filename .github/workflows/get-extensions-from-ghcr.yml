name: Get Extensions from GHCR
on:
  workflow_dispatch:
  workflow_call:

jobs:
  get-ghcr-extensions:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space on Ubuntu runner
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          
      - name: Pull ghcr extensions and run container
        run: |
          # HACK(one-time 0.22.0 rerun): pinned to the image pushed by the
          # 0.21.2 release build (run 36818419211) instead of :latest, which
          # currently holds the corrupted 0.22.0 build that damaged the
          # 0.21.0 extensions. REVERT to :latest once we have a working
          # extension build.
          docker pull ghcr.io/ladybugdb/extension-repo@sha256:28a44c71ebd342838666c5457d6ef7fd6c597d50c92f46f8e6babc9da4e1627d
          docker run --rm -d --name lbug-extensions ghcr.io/ladybugdb/extension-repo@sha256:28a44c71ebd342838666c5457d6ef7fd6c597d50c92f46f8e6babc9da4e1627d tail -f /dev/null
      
      - name: Copy ghcr extensions
        run: |
          mkdir ./ghcr-extensions
          docker cp lbug-extensions:/usr/share/nginx/html ./ghcr-extensions
          sudo chown -R $USER:$USER ghcr-extensions
          sudo chmod -R 755 ghcr-extensions
          mv ghcr-extensions/html/dataset ghcr-extensions/dataset
          mv ghcr-extensions/html/ ghcr-extensions/releases

      - name: Upload ghcr extensions
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-extensions
          path: ghcr-extensions
